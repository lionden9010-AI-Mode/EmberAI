name: CI
on: [push, pull_request]
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
   codex/bootstrap-emberai-monorepo-and-implement-foundation
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
 main
      - run: npm install
      - run: npm run check
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/android } }
    steps:
 codex/bootstrap-emberai-monorepo-and-implement-foundation
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: 8.10.2 }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v5

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
 main
        with: { name: emberai-android-artifacts, path: 'apps/android/app/build/outputs/**/*.apk' }
