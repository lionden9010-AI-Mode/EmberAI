name: CI
on: [push, pull_request]
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm install
      - run: npm run check
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/android } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: 8.10.2 }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v5
        with: { name: emberai-android-artifacts, path: 'apps/android/app/build/outputs/**/*.apk' }
